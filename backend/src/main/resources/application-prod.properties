spring.docker.compose.enabled=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
app.security.mode=oauth2
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${OIDC_AUDIENCE}
app.security.roles-claim=${OIDC_ROLES_CLAIM:roles}
app.security.admin-role=${OIDC_ADMIN_ROLE:tableflow-admin}
app.security.principal-claim=${OIDC_PRINCIPAL_CLAIM:sub}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}
app.reservation.encryption-key=${RESERVATION_ENCRYPTION_KEY}
app.reservation.encryption-key-id=${RESERVATION_ENCRYPTION_KEY_ID}
app.reservation.previous-encryption-key=${RESERVATION_PREVIOUS_ENCRYPTION_KEY:}
app.reservation.previous-encryption-key-id=${RESERVATION_PREVIOUS_ENCRYPTION_KEY_ID:previous}
app.reservation.hmac-key=${RESERVATION_HMAC_KEY}
app.reservation.retention.enabled=true
app.reservation.encryption-rotation.enabled=${RESERVATION_ENCRYPTION_ROTATION_ENABLED:false}
app.public-rate-limit.enabled=true
app.public-rate-limit.create-limit=${PUBLIC_CREATE_RATE_LIMIT:10}
app.public-rate-limit.management-limit=${PUBLIC_MANAGEMENT_RATE_LIMIT:30}
app.public-rate-limit.window-seconds=${PUBLIC_RATE_LIMIT_WINDOW_SECONDS:60}
server.error.include-message=never
server.error.include-binding-errors=never
