spring.application.name=tableflow-backend
spring.profiles.default=local
spring.threads.virtual.enabled=true
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app-local-password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.flyway.enabled=true
server.shutdown=graceful
server.forward-headers-strategy=framework
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=${APP_VERSION:local}
logging.pattern.level=%5p [traceId:%X{traceId:-}]
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.reservation.privacy-policy-version=${PRIVACY_POLICY_VERSION:2026-08-16}
app.reservation.encryption-key-id=${RESERVATION_ENCRYPTION_KEY_ID:primary}
app.reservation.previous-encryption-key=${RESERVATION_PREVIOUS_ENCRYPTION_KEY:}
app.reservation.previous-encryption-key-id=${RESERVATION_PREVIOUS_ENCRYPTION_KEY_ID:previous}
app.reservation.retention.enabled=false
app.reservation.retention.days=${RESERVATION_RETENTION_DAYS:365}
app.reservation.retention.batch-size=${RESERVATION_RETENTION_BATCH_SIZE:100}
app.reservation.retention.cron=${RESERVATION_RETENTION_CRON:0 20 3 * * *}
app.reservation.encryption-rotation.enabled=false
app.reservation.encryption-rotation.batch-size=${RESERVATION_ENCRYPTION_ROTATION_BATCH_SIZE:100}
app.reservation.encryption-rotation.cron=${RESERVATION_ENCRYPTION_ROTATION_CRON:0 40 3 * * *}
app.public-rate-limit.enabled=false
