name: tableflow-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    networks: [application]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-app}
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:?OIDC_ISSUER_URI must be set}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?OIDC_AUDIENCE must be set}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
      OIDC_ADMIN_ROLE: ${OIDC_ADMIN_ROLE:-tableflow-admin}
      OIDC_PRINCIPAL_CLAIM: ${OIDC_PRINCIPAL_CLAIM:-sub}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?CORS_ALLOWED_ORIGIN must be set}
      RESERVATION_ENCRYPTION_KEY: ${RESERVATION_ENCRYPTION_KEY:?RESERVATION_ENCRYPTION_KEY must be set}
      RESERVATION_ENCRYPTION_KEY_ID: ${RESERVATION_ENCRYPTION_KEY_ID:?RESERVATION_ENCRYPTION_KEY_ID must be set}
      RESERVATION_PREVIOUS_ENCRYPTION_KEY: ${RESERVATION_PREVIOUS_ENCRYPTION_KEY:-}
      RESERVATION_PREVIOUS_ENCRYPTION_KEY_ID: ${RESERVATION_PREVIOUS_ENCRYPTION_KEY_ID:-previous}
      RESERVATION_HMAC_KEY: ${RESERVATION_HMAC_KEY:?RESERVATION_HMAC_KEY must be set}
      RESERVATION_RETENTION_DAYS: ${RESERVATION_RETENTION_DAYS:-365}
      RESERVATION_RETENTION_BATCH_SIZE: ${RESERVATION_RETENTION_BATCH_SIZE:-100}
      RESERVATION_RETENTION_CRON: ${RESERVATION_RETENTION_CRON:-0 20 3 * * *}
      RESERVATION_ENCRYPTION_ROTATION_ENABLED: ${RESERVATION_ENCRYPTION_ROTATION_ENABLED:-false}
      RESERVATION_ENCRYPTION_ROTATION_BATCH_SIZE: ${RESERVATION_ENCRYPTION_ROTATION_BATCH_SIZE:-100}
      RESERVATION_ENCRYPTION_ROTATION_CRON: ${RESERVATION_ENCRYPTION_ROTATION_CRON:-0 40 3 * * *}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:?PRIVACY_POLICY_VERSION must be set}
      PUBLIC_CREATE_RATE_LIMIT: ${PUBLIC_CREATE_RATE_LIMIT:-10}
      PUBLIC_MANAGEMENT_RATE_LIMIT: ${PUBLIC_MANAGEMENT_RATE_LIMIT:-30}
      PUBLIC_RATE_LIMIT_WINDOW_SECONDS: ${PUBLIC_RATE_LIMIT_WINDOW_SECONDS:-60}
      APP_VERSION: ${APP_VERSION:-local}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    expose: ["8080"]
    networks: [application]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ADMIN_AUTH_MODE: oidc
        VITE_OIDC_AUTHORITY: ${OIDC_ISSUER_URI:?OIDC_ISSUER_URI must be set}
        VITE_OIDC_CLIENT_ID: ${OIDC_SPA_CLIENT_ID:?OIDC_SPA_CLIENT_ID must be set}
        VITE_OIDC_SCOPE: ${OIDC_SPA_SCOPE:?OIDC_SPA_SCOPE must be set}
        VITE_OIDC_RESOURCE: ${OIDC_SPA_RESOURCE:-}
        VITE_OIDC_REDIRECT_URI: ${APP_PUBLIC_URL:?APP_PUBLIC_URL must be set}/auth/callback
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${APP_PUBLIC_URL:?APP_PUBLIC_URL must be set}/auth/logout-callback
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_FILTER: OIDC_CSP_CONNECT_SRC
      OIDC_CSP_CONNECT_SRC: ${OIDC_CSP_CONNECT_SRC:?OIDC_CSP_CONNECT_SRC must be set}
    ports:
      - "${APP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [application]

volumes:
  postgres-prod-data:

networks:
  application:
    driver: bridge
