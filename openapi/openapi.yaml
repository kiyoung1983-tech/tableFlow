openapi: 3.1.0
info:
  title: TableFlow API
  version: 0.7.0
  description: |
    TableFlow 식당 예약 MVP의 공개 예약 및 관리자 운영 계약입니다.
    공개 응답은 예약 관리 토큰과 요청 추적 ID를 사용하고,
    관리자 API는 환경에 따라 개발용 Basic 또는 OIDC JWT 인증을 사용합니다.
servers:
  - url: http://localhost:8080
    description: Local Spring Boot server
tags:
  - name: Public Booking
  - name: Public Availability
  - name: Public Reservations
  - name: Admin Settings
  - name: Admin Reservations
paths:
  /actuator/health:
    get:
      operationId: getHealth
      summary: 애플리케이션 상태 조회
      responses:
        "200":
          description: 애플리케이션이 정상적으로 동작 중입니다.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/todos:
    get:
      operationId: listTodos
      summary: 전환 기간 Todo 목록 조회
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 생성일 역순의 Todo 페이지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoPageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
    post:
      operationId: createTodo
      summary: 전환 기간 Todo 생성
      security:
        - basicAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoRequest"
      responses:
        "201":
          description: 생성된 Todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"

  /api/todos/{id}:
    get:
      operationId: getTodo
      summary: 전환 기간 Todo 단건 조회
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 요청한 Todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/public/booking-context:
    get:
      tags: [Public Booking]
      operationId: getBookingContext
      summary: 공개 예약 화면 초기 정보 조회
      description: 활성 식당의 활성 지점과 현재 개인정보 정책 정보를 반환합니다.
      security: []
      responses:
        "200":
          description: 예약 가능한 지점과 개인정보 정책 기준
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingContextResponse"

  /api/public/branches/{branchId}/availability:
    get:
      tags: [Public Availability]
      operationId: getBranchAvailability
      summary: 예약 가능 시간 조회
      description: 응답은 조회 시점의 안내이며 예약 생성을 보장하지 않습니다.
      security: []
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - name: date
          in: query
          required: true
          description: 지점 현지 날짜
          schema:
            type: string
            format: date
        - name: partySize
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: 조건에 맞는 예약 시작 후보
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/PolicyViolation"

  /api/public/reservations:
    post:
      tags: [Public Reservations]
      operationId: createReservation
      summary: 예약 요청 생성
      description: 가용성을 다시 확인하고 테이블이 배정된 PENDING 예약을 생성합니다.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: 생성된 예약. manageToken은 이 응답에서만 전달됩니다.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationCreatedResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/PolicyViolation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/public/reservations/{reservationCode}:
    parameters:
      - $ref: "#/components/parameters/ReservationCode"
    get:
      tags: [Public Reservations]
      operationId: getReservation
      summary: 고객 예약 조회
      description: 예약 번호가 없거나 관리 토큰이 일치하지 않으면 동일한 404 응답을 반환합니다.
      security:
        - reservationToken: []
      responses:
        "200":
          description: 고객에게 공개되는 예약 상세
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicReservationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      tags: [Public Reservations]
      operationId: changeReservation
      summary: 고객 예약 변경
      security:
        - reservationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeReservationRequest"
      responses:
        "200":
          description: 변경된 예약
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicReservationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/PolicyViolation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/public/reservations/{reservationCode}/cancellation:
    post:
      tags: [Public Reservations]
      operationId: cancelReservation
      summary: 고객 예약 취소
      security:
        - reservationToken: []
      parameters:
        - $ref: "#/components/parameters/ReservationCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelReservationRequest"
      responses:
        "200":
          description: 취소된 예약
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicReservationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/PolicyViolation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/admin/restaurants:
    get:
      tags: [Admin Settings]
      operationId: listRestaurants
      summary: 식당 목록 조회
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: 이름 순 식당 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RestaurantResponse" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
    post:
      tags: [Admin Settings]
      operationId: createRestaurant
      summary: 식당 생성
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRestaurantRequest" }
      responses:
        "201":
          description: 생성된 식당
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestaurantResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }

  /api/admin/restaurants/{restaurantId}:
    parameters:
      - $ref: "#/components/parameters/RestaurantId"
    get:
      tags: [Admin Settings]
      operationId: getRestaurant
      summary: 식당 조회
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: 식당 정보
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestaurantResponse" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Admin Settings]
      operationId: updateRestaurant
      summary: 식당 변경
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRestaurantRequest" }
      responses:
        "200":
          description: 변경된 식당
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestaurantResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/restaurants/{restaurantId}/branches:
    get:
      tags: [Admin Settings]
      operationId: listBranches
      summary: 식당의 지점 목록 조회
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RestaurantId"
      responses:
        "200":
          description: 이름 순 지점 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BranchResponse" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Admin Settings]
      operationId: createBranch
      summary: 지점 생성
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RestaurantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBranchRequest" }
      responses:
        "201":
          description: 생성된 지점
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /api/admin/branches/{branchId}:
    parameters:
      - $ref: "#/components/parameters/BranchId"
    get:
      tags: [Admin Settings]
      operationId: getBranch
      summary: 지점과 예약 정책 조회
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: 지점 정보
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchResponse" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Admin Settings]
      operationId: updateBranch
      summary: 지점과 예약 정책 변경
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBranchRequest" }
      responses:
        "200":
          description: 변경된 지점
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /api/admin/branches/{branchId}/tables:
    parameters:
      - $ref: "#/components/parameters/BranchId"
    get:
      tags: [Admin Settings]
      operationId: listDiningTables
      summary: 테이블 목록 조회
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: 수용 인원·이름 순 테이블 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiningTableResponse" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Admin Settings]
      operationId: createDiningTable
      summary: 테이블 생성
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDiningTableRequest" }
      responses:
        "201":
          description: 생성된 테이블
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiningTableResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/tables/{tableId}:
    patch:
      tags: [Admin Settings]
      operationId: updateDiningTable
      summary: 테이블 변경
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: tableId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDiningTableRequest" }
      responses:
        "200":
          description: 변경된 테이블
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiningTableResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/admin/branches/{branchId}/business-hours:
    parameters:
      - $ref: "#/components/parameters/BranchId"
    get:
      tags: [Admin Settings]
      operationId: getBusinessHours
      summary: 주간 영업시간 조회
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: 주간 영업시간
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessHoursResponse" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Admin Settings]
      operationId: replaceBusinessHours
      summary: 주간 영업시간 전체 교체
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceBusinessHoursRequest" }
      responses:
        "200":
          description: 교체된 주간 영업시간
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessHoursResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /api/admin/branches/{branchId}/booking-blocks:
    parameters:
      - $ref: "#/components/parameters/BranchId"
    get:
      tags: [Admin Settings]
      operationId: listBookingBlocks
      summary: 기간과 겹치는 차단 시간 조회
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: startsAt
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: endsAt
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: 차단 시간 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BookingBlockResponse" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
    post:
      tags: [Admin Settings]
      operationId: createBookingBlock
      summary: 차단 시간 생성
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookingBlockRequest" }
      responses:
        "201":
          description: 생성된 차단 시간
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingBlockResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /api/admin/booking-blocks/{bookingBlockId}:
    delete:
      tags: [Admin Settings]
      operationId: deleteBookingBlock
      summary: 차단 시간 삭제
      security: [{ basicAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: bookingBlockId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: 차단 시간이 삭제되었습니다. }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/branches/{branchId}/reservations:
    get:
      tags: [Admin Reservations]
      operationId: listAdminReservations
      summary: 관리자 예약 목록 조회
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - name: date
          in: query
          required: true
          description: 지점 현지 날짜
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReservationStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 시작 시각 순 예약 페이지
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReservationPageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/branches/{branchId}/reservation-dashboard:
    get:
      tags: [Admin Reservations]
      operationId: getAdminReservationDashboard
      summary: 관리자 날짜별 예약 현황 조회
      description: 지점 현지 날짜의 상태 건수와 영업시간 슬롯별 테이블 수를 반환합니다.
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - name: date
          in: query
          required: true
          description: 지점 현지 날짜
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 날짜별 예약 운영 현황
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReservationDashboardResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/reservations/{reservationId}:
    get:
      tags: [Admin Reservations]
      operationId: getAdminReservation
      summary: 관리자 예약 상세 조회
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: 개인정보 표시 범위를 제한한 예약 상세와 상태 이력
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReservationResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/reservations/{reservationId}/transitions:
    post:
      tags: [Admin Reservations]
      operationId: transitionReservation
      summary: 관리자 예약 상태 전이
      security:
        - basicAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionReservationRequest"
      responses:
        "200":
          description: 전이된 예약
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReservationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: local/test 프로필에서만 사용하는 개발용 관리자 인증
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: prod 프로필에서 issuer, audience, 관리자 역할을 검증하는 OIDC 액세스 토큰
    reservationToken:
      type: apiKey
      in: header
      name: X-Reservation-Token
      description: 예약 생성 응답에서 한 번 전달되는 고객 예약 관리 토큰

  headers:
    RequestId:
      description: 요청과 서버 로그를 연결하는 추적 ID
      schema:
        type: string

  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BranchId:
      name: branchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReservationCode:
      name: reservationCode
      in: path
      required: true
      description: 고객에게 발급된 10자리 예약 번호
      schema:
        type: string
        pattern: "^[A-HJ-NP-Z2-9]{10}$"
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 예약 생성 의도를 식별하는 요청별 UUID
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: 0부터 시작하는 페이지 번호
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: 페이지당 항목 수
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    ValidationError:
      description: 요청값 검증 실패
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblemDetail"
    AuthenticationRequired:
      description: 관리자 인증 정보가 없거나 올바르지 않음
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    AccessDenied:
      description: 요청을 수행할 관리자 권한이 없음
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    InvalidReservationToken:
      description: 예약 관리 토큰이 없거나 올바르지 않음
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: 요청한 리소스가 존재하지 않음
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: 예약 경합, 중복, 상태 또는 버전 충돌
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    PolicyViolation:
      description: 영업시간 또는 예약 정책 위반
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    RateLimited:
      description: 공개 예약 API의 클라이언트별 요청 한도 초과
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: 다시 요청하기 전 대기할 초 단위 시간
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [UP]
      additionalProperties: true

    CreateTodoRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200

    TodoResponse:
      type: object
      required: [id, title, completed, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        completed:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TodoPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages, first, last]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TodoResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        first:
          type: boolean
        last:
          type: boolean

    OperationalStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    BookingContextResponse:
      type: object
      required: [privacyPolicyVersion, privacyRetentionDays, branches]
      properties:
        privacyPolicyVersion:
          type: string
        privacyRetentionDays:
          type: integer
          minimum: 1
        branches:
          type: array
          items:
            $ref: "#/components/schemas/PublicBranchResponse"

    PublicBranchResponse:
      type: object
      required:
        - id
        - restaurantName
        - name
        - address
        - timezone
        - bookingHorizonDays
        - maxPartySize
      properties:
        id: { type: string, format: uuid }
        restaurantName: { type: string }
        name: { type: string }
        address: { type: string }
        timezone: { type: string }
        bookingHorizonDays: { type: integer, minimum: 1, maximum: 365 }
        maxPartySize: { type: integer, minimum: 1, maximum: 100 }

    CreateRestaurantRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
      additionalProperties: false

    UpdateRestaurantRequest:
      type: object
      required: [expectedVersion]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        status: { $ref: "#/components/schemas/OperationalStatus" }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false

    RestaurantResponse:
      type: object
      required: [id, name, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: "#/components/schemas/OperationalStatus" }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateBranchRequest:
      type: object
      required: [name, address, timezone]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, minLength: 1, maxLength: 300 }
        timezone:
          type: string
          minLength: 1
          maxLength: 50
          examples: [Asia/Seoul]
      additionalProperties: false

    UpdateBranchRequest:
      type: object
      required: [expectedVersion]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, minLength: 1, maxLength: 300 }
        timezone: { type: string, minLength: 1, maxLength: 50 }
        status: { $ref: "#/components/schemas/OperationalStatus" }
        slotIntervalMinutes: { type: integer, minimum: 5, maximum: 120 }
        defaultDurationMinutes: { type: integer, minimum: 15, maximum: 720 }
        bufferMinutes: { type: integer, minimum: 0, maximum: 240 }
        minAdvanceMinutes: { type: integer, minimum: 0, maximum: 10080 }
        bookingHorizonDays: { type: integer, minimum: 1, maximum: 365 }
        changeCutoffMinutes: { type: integer, minimum: 0, maximum: 10080 }
        noShowGraceMinutes: { type: integer, minimum: 0, maximum: 1440 }
        maxPartySize: { type: integer, minimum: 1, maximum: 100 }
        maxCapacityGap: { type: integer, minimum: 0, maximum: 100 }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false

    BranchResponse:
      type: object
      required:
        - id
        - restaurantId
        - name
        - address
        - timezone
        - status
        - slotIntervalMinutes
        - defaultDurationMinutes
        - bufferMinutes
        - minAdvanceMinutes
        - bookingHorizonDays
        - changeCutoffMinutes
        - noShowGraceMinutes
        - maxPartySize
        - maxCapacityGap
        - version
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        timezone: { type: string }
        status: { $ref: "#/components/schemas/OperationalStatus" }
        slotIntervalMinutes: { type: integer }
        defaultDurationMinutes: { type: integer }
        bufferMinutes: { type: integer }
        minAdvanceMinutes: { type: integer }
        bookingHorizonDays: { type: integer }
        changeCutoffMinutes: { type: integer }
        noShowGraceMinutes: { type: integer }
        maxPartySize: { type: integer }
        maxCapacityGap: { type: integer }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateDiningTableRequest:
      type: object
      required: [name, capacity]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        capacity: { type: integer, minimum: 1, maximum: 100 }
      additionalProperties: false

    UpdateDiningTableRequest:
      type: object
      required: [expectedVersion]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        capacity: { type: integer, minimum: 1, maximum: 100 }
        enabled: { type: boolean }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false

    DiningTableResponse:
      type: object
      required: [id, branchId, name, capacity, enabled, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        name: { type: string }
        capacity: { type: integer }
        enabled: { type: boolean }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ReplaceBusinessHoursRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 28
          items: { $ref: "#/components/schemas/BusinessHourRequest" }
      additionalProperties: false

    BusinessHourRequest:
      type: object
      required: [dayOfWeek, opensAt, closesAt]
      properties:
        dayOfWeek: { type: integer, minimum: 1, maximum: 7 }
        opensAt:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]:00$"
        closesAt:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]:00$"
      additionalProperties: false

    BusinessHoursResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BusinessHourResponse" }

    BusinessHourResponse:
      type: object
      required: [id, dayOfWeek, opensAt, closesAt]
      properties:
        id: { type: string, format: uuid }
        dayOfWeek: { type: integer }
        opensAt: { type: string }
        closesAt: { type: string }

    CreateBookingBlockRequest:
      type: object
      required: [startsAt, endsAt, reason]
      properties:
        diningTableId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        reason: { type: string, minLength: 1, maxLength: 500 }
      additionalProperties: false

    BookingBlockResponse:
      type: object
      required: [id, branchId, startsAt, endsAt, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        diningTableId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        reason: { type: string }
        createdAt: { type: string, format: date-time }

    ReservationStatus:
      type: string
      enum: [PENDING, CONFIRMED, SEATED, COMPLETED, CANCELLED, NO_SHOW]

    AvailabilityResponse:
      type: object
      required: [branchId, date, timezone, partySize, asOf, slots]
      properties:
        branchId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        timezone:
          type: string
          examples: [Asia/Seoul]
        partySize:
          type: integer
        asOf:
          type: string
          format: date-time
        slots:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilitySlot"

    AvailabilitySlot:
      type: object
      required: [startsAt, endsAt, availableTableCount]
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        availableTableCount:
          type: integer
          minimum: 1

    CreateReservationRequest:
      type: object
      required: [branchId, startsAt, partySize, guestName, guestPhone, privacyAgreement]
      properties:
        branchId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
          description: offset을 포함한 예약 시작 시각
        partySize:
          type: integer
          minimum: 1
          maximum: 100
        guestName:
          type: string
          minLength: 1
          maxLength: 100
        guestPhone:
          type: string
          minLength: 8
          maxLength: 20
          description: 서버에서 국제 형식으로 정규화합니다.
        privacyAgreement:
          $ref: "#/components/schemas/PrivacyAgreement"
      additionalProperties: false

    PrivacyAgreement:
      type: object
      required: [agreed, policyVersion]
      properties:
        agreed:
          type: boolean
          const: true
        policyVersion:
          type: string
          minLength: 1
          maxLength: 50
      additionalProperties: false

    ChangeReservationRequest:
      type: object
      required: [expectedVersion]
      anyOf:
        - required: [startsAt]
        - required: [partySize]
      properties:
        startsAt:
          type: string
          format: date-time
          description: offset을 포함한 변경할 시작 시각
        partySize:
          type: integer
          minimum: 1
          maximum: 100
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false

    CancelReservationRequest:
      type: object
      required: [expectedVersion]
      properties:
        reason:
          type: string
          maxLength: 500
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
      additionalProperties: false

    ReservationCreatedResponse:
      type: object
      required: [reservation, manageToken]
      properties:
        reservation:
          $ref: "#/components/schemas/PublicReservationResponse"
        manageToken:
          type: string
          minLength: 43
          description: 다시 조회할 수 없으므로 고객이 안전하게 보관해야 합니다.

    PublicReservationResponse:
      type: object
      required:
        - reservationCode
        - branchId
        - branchName
        - timezone
        - tableName
        - partySize
        - startsAt
        - endsAt
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        reservationCode:
          type: string
        branchId:
          type: string
          format: uuid
        branchName:
          type: string
        timezone:
          type: string
          examples: [Asia/Seoul]
        tableName:
          type: string
        partySize:
          type: integer
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ReservationStatus"
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminReservationResponse:
      allOf:
        - $ref: "#/components/schemas/PublicReservationResponse"
        - type: object
          required: [id, guestName, guestPhoneLastFour, history]
          properties:
            id:
              type: string
              format: uuid
            guestName:
              type: string
            guestPhoneLastFour:
              type: string
              pattern: "^[0-9]{4}$"
            history:
              type: array
              items:
                $ref: "#/components/schemas/ReservationStatusHistoryResponse"

    ReservationStatusHistoryResponse:
      type: object
      required: [toStatus, actorType, changedAt]
      properties:
        fromStatus:
          oneOf:
            - $ref: "#/components/schemas/ReservationStatus"
            - type: "null"
        toStatus:
          $ref: "#/components/schemas/ReservationStatus"
        actorType:
          type: string
          enum: [CUSTOMER, ADMIN, SYSTEM]
        actorId:
          type: string
        reason:
          type: string
        changedAt:
          type: string
          format: date-time

    TransitionReservationRequest:
      type: object
      required: [targetStatus, expectedVersion]
      properties:
        targetStatus:
          type: string
          enum: [CONFIRMED, SEATED, COMPLETED, CANCELLED, NO_SHOW]
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
          maxLength: 500
      additionalProperties: false

    AdminReservationPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages, first, last]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminReservationResponse"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        first:
          type: boolean
        last:
          type: boolean

    AdminReservationDashboardResponse:
      type: object
      required:
        - branchId
        - date
        - timezone
        - asOf
        - totalEnabledTables
        - statusCounts
        - capacityTimeline
      properties:
        branchId: { type: string, format: uuid }
        date: { type: string, format: date }
        timezone: { type: string, examples: [Asia/Seoul] }
        asOf: { type: string, format: date-time }
        totalEnabledTables: { type: integer, minimum: 0 }
        statusCounts:
          $ref: "#/components/schemas/AdminReservationStatusCounts"
        capacityTimeline:
          type: array
          items:
            $ref: "#/components/schemas/AdminCapacityBucket"

    AdminReservationStatusCounts:
      type: object
      required: [pending, confirmed, seated, completed, cancelled, noShow]
      properties:
        pending: { type: integer, format: int64, minimum: 0 }
        confirmed: { type: integer, format: int64, minimum: 0 }
        seated: { type: integer, format: int64, minimum: 0 }
        completed: { type: integer, format: int64, minimum: 0 }
        cancelled: { type: integer, format: int64, minimum: 0 }
        noShow: { type: integer, format: int64, minimum: 0 }

    AdminCapacityBucket:
      type: object
      required:
        - startsAt
        - endsAt
        - availableTableCount
        - occupiedTableCount
        - blockedTableCount
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        availableTableCount: { type: integer, minimum: 0 }
        occupiedTableCount: { type: integer, minimum: 0 }
        blockedTableCount: { type: integer, minimum: 0 }

    ProblemDetail:
      type: object
      required: [title, status, detail, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        traceId: { type: string }
      additionalProperties: true
    ValidationProblemDetail:
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
