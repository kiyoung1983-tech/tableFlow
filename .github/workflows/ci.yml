name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x backend/gradlew
      - run: ./backend/gradlew -p backend test
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: node --test scripts/staging-smoke.test.mjs
      - run: node --test scripts/deployment-preflight.test.mjs
      - run: node --test scripts/staging-uat.test.mjs
      - run: npm ci --prefix frontend
      - run: npm run check --prefix frontend
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: spring-fullstack-backend:ci
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: spring-fullstack-frontend:ci
